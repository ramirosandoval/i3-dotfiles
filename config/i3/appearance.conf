# Dark blue desktop. Loaded only after Polybar is installed and verified.
font pango:JetBrains Mono 10
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart
gaps inner 10
gaps outer 4
smart_gaps on
client.focused          #8aadf4 #24273a #cad3f5 #8aadf4 #8aadf4
client.focused_inactive #363a4f #1e2030 #8087a2 #363a4f #363a4f
client.unfocused        #363a4f #1e2030 #8087a2 #363a4f #363a4f
client.urgent           #ed8796 #ed8796 #181926 #ed8796 #ed8796
client.background       #181926
for_window [class="Pavucontrol|Nm-connection-editor|Zenity"] floating enable
exec_always --no-startup-id ~/.config/polybar/launch.sh
exec --no-startup-id sh -c 'if [ -f "$HOME/.fehbg" ]; then sh "$HOME/.fehbg"; else xsetroot -solid "#181926"; fi'
bindsym $mod+comma exec --no-startup-id ~/.config/polybar/settings.sh
