[colors]
background = #1e2030
foreground = #cad3f5
muted = #8087a2
accent = #8aadf4
green = #a6da95
red = #ed8796

[bar/main]
locale = es_AR.UTF-8
width = 100%
height = 38
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
padding-left = 2
padding-right = 2
module-margin = 4px
font-0 = JetBrains Mono:size=10;3
font-1 = FontAwesome:size=12;3
modules-left = launcher i3 pomodoro
modules-center = date
modules-right = cpu memory network wifi display brightness audio microphone battery settings lock tray
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[module/launcher]
type = custom/text
format = 
format-foreground = ${colors.accent}
click-left = rofi -show drun
click-right = rofi -show window

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = false
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-foreground = ${colors.red}
label-focused = %index%
label-focused-background = #363a4f
label-focused-foreground = ${colors.accent}
label-focused-underline = ${colors.accent}
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1
label-visible = %index%
label-visible-padding = 1
label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
date-alt = %Y-%m-%d
time-alt = %H:%M:%S
label = %date%  ·  %time%
label-foreground = ${colors.foreground}

[module/pomodoro]
type = custom/script
exec = python3 ~/.config/polybar/pomodoro.py status
interval = 1
click-left = python3 ~/.config/polybar/pomodoro.py toggle
click-right = python3 ~/.config/polybar/pomodoro.py menu

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "RAM "
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%

[module/network]
type = internal/network
interface = ${env:ETHERNET_INTERFACE:}
interval = 3
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = %{A1:x-terminal-emulator -e nmtui connect:}%{A}
label-connected-foreground = ${colors.green}
label-disconnected = %{A1:x-terminal-emulator -e nmtui connect:}%{A}
label-disconnected-foreground = ${colors.muted}

[module/wifi]
type = internal/network
interface = ${env:WIFI_INTERFACE:}
interval = 3
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = %{A1:x-terminal-emulator -e nmtui connect:}%{A}
label-connected-foreground = ${colors.green}
label-disconnected = %{A1:x-terminal-emulator -e nmtui connect:}%{A}
label-disconnected-foreground = ${colors.muted}

[module/display]
type = custom/text
format = 
format-foreground = ${colors.accent}
click-left = python3 ~/.config/polybar/display.py

[module/brightness]
type = custom/script
exec = python3 ~/.config/polybar/brightness.py
interval = 1
format-prefix = " "
format-prefix-foreground = ${colors.accent}
scroll-up = python3 ~/.config/polybar/brightness.py up
scroll-down = python3 ~/.config/polybar/brightness.py down
click-left = python3 ~/.config/polybar/brightness.py reset

[module/audio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <label-volume>
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage%%
label-muted =  Silencio
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/microphone]
type = custom/script
exec = python3 ~/.config/polybar/microphone.py
interval = 1

[module/battery]
type = custom/script
exec = python3 ~/.config/polybar/battery.py
interval = 2

[module/settings]
type = custom/text
format = 
format-foreground = ${colors.accent}
click-left = ~/.config/polybar/settings.sh

[module/lock]
type = custom/text
format = 
format-foreground = ${colors.muted}
click-left = loginctl lock-session

[module/tray]
type = internal/tray
tray-size = 18
tray-spacing = 8

[settings]
screenchange-reload = true
pseudo-transparency = false
